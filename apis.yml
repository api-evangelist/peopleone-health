name: PeopleOne Health
description: 'PeopleOne Health is a nationwide provider of value-based, employer-funded advanced
  primary care, delivering comprehensive physical and mental health services with no copays,
  deductibles, or coinsurance for members. Its model pairs dedicated care teams with a
  prevention-first approach to lower total cost of care for self-funded employers while
  improving member health outcomes, and it was named a 2024 Best Nationwide Primary Care
  Provider by the Validation Institute. Surfaced as a portfolio company of GV, PeopleOne
  Health operates as a healthcare services provider rather than an API platform: member
  access is delivered through a healow-based patient portal and a member portal, and no
  public developer API, OpenAPI specification, or developer documentation is published.'
